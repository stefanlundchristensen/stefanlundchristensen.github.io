<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>S + C · Tre hjerter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3eedf;--card:#fffaf0;--ink:#641b33;--rule:#641b3340;--table:#e5dac6;--serif:Georgia,'Times New Roman',serif;--hand:'Caveat','Bradley Hand',cursive;--sans:'DM Sans',Arial,sans-serif;--gutter:max(16px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,p{margin:0}
h1,h2{font-family:var(--serif);font-weight:400}
em{font-family:var(--hand);font-style:normal}
.top{max-width:1180px;margin:auto;padding:calc(28px + env(safe-area-inset-top,0px)) var(--gutter) 10px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-bottom:1px solid var(--rule)}
.logo{font:italic 32px/1 var(--serif);letter-spacing:-.05em}
.logo span{display:block;font:500 11px/1 var(--sans);letter-spacing:.16em;margin-top:8px;font-style:normal}
.top a{font-size:14px;color:inherit;text-decoration:none;border-bottom:1px solid var(--rule);min-height:44px;display:inline-flex;align-items:center}
.intro{max-width:1180px;margin:auto;padding:36px var(--gutter) 22px}
.intro h1{font-size:clamp(44px,7vw,88px);line-height:.95;letter-spacing:-.045em;margin-bottom:14px}
.intro p{max-width:56ch}
.grid{max-width:1180px;margin:auto;padding:0 var(--gutter) calc(60px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px}
figure{margin:0;background:var(--table);border-radius:6px;padding:clamp(18px,4vw,32px)}
.front{container-type:inline-size;position:relative;aspect-ratio:1;background:var(--card);box-shadow:0 8px 22px -8px #57152d44,0 22px 44px -26px #57152d55}
.front::before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1px solid #641b3318}
.front img{position:absolute;left:18cqw;top:13.5cqw;width:64cqw}
.front .ini{position:absolute;left:0;right:0;top:35cqw;text-align:center;font:25cqw/1 var(--hand);color:#2a0d16;white-space:nowrap}
.front .ini i{font-style:normal;font-size:.5em;vertical-align:.18em}
.front .say{position:absolute;left:0;right:0;top:83cqw;text-align:center;font:10.5cqw/1 var(--serif);letter-spacing:-.045em}
.front .say em{font-size:1.45em;letter-spacing:0;margin-left:.12em}
figcaption{margin-top:16px}
figcaption h2{font-size:26px;letter-spacing:-.02em}
figcaption h2 span{font:600 12px/1 var(--sans);letter-spacing:.14em;margin-right:10px;vertical-align:middle}
figcaption p{font-size:15px;margin-top:4px}
</style>
</head>
<body>
<div class="top"><div class="logo">S + C<span>HJERTET · TRE UDGAVER</span></div><a href="invitation.html">Invitationen →</a></div>
<div class="intro">
  <h1>Malet <em>i akvarel.</em></h1>
  <p>Tre udgaver af hjertet med struktur som vådt-i-vådt-akvarel. Hænderne er stadig klippet i papir, som på jeres håndlavede kort.</p>
</div>
<div class="grid">
  <figure><div class="front"><img src="hearts/hjerte-1.webp" alt=""><p class="ini">S <i>+</i> C</p><p class="say">Bryllups<em>fest</em></p></div>
    <figcaption><h2><span>01</span>Vådt-i-vådt</h2><p>Karmin, cinnober og rosa flyder sammen. Blød kant med lidt farve, der løber ud i papiret.</p></figcaption></figure>
  <figure><div class="front"><img src="hearts/hjerte-2.webp" alt=""><p class="ini">S <i>+</i> C</p><p class="say">Bryllups<em>fest</em></p></div>
    <figcaption><h2><span>02</span>Lasurstrøg</h2><p>Skrå, gennemsigtige penselstrøg lag på lag. Tættest på jeres håndlavede hjerte. Bruges lige nu på hjemmesiden og i tryksagerne.</p></figcaption></figure>
  <figure><div class="front"><img src="hearts/hjerte-5.webp" alt=""><p class="ini">S <i>+</i> C</p><p class="say">Bryllups<em>fest</em></p></div>
    <figcaption><h2><span>05</span>Tre lag</h2><p>Tre gennemsigtige hjerter i rosa, cinnober og magenta lagt lidt forskudt oven på hinanden.</p></figcaption></figure>
</div>
</body>
</html>
